# Rows of the legacy "Метрики РНП" sheet → dashboard metrics (app:import:rnp-sheet).
# Row names are compared normalized (case, spaces, Latin look-alikes, trailing "- 5000" / "- 46%").
# Decision 05.11.2026: only metrics that exist in the dashboard; automatic metrics take plans only
# (facts come from the platform / Bitrix), manual ones take plans and weekly facts.
# Not mapped on purpose: calls (the sheet holds a daily average, the dashboard a weekly count).
# HR percentages (probation, 1-1, turnover, eNPS): the sheet keeps current values in the plan column — not imported.

# Rows with only column B filled that open a department section.
sections: [Marketing, Revenue, Finance, CS, Sales, Operations, HR, IT]

metrics:
  # Marketing
  mkt_ad_spend:
    section: Marketing
    rows: ['Расход на рекламу', 'Расход на рекламу (100-110 евро)']
  mkt_leads:
    section: Marketing
    rows: ['Лиды']
  mkt_qualified_leads:
    section: Marketing
    rows: ['Квал-лиды', 'Квал лиды', 'Квал лиды - 2']
  mkt_cpl:
    section: Marketing
    rows: ['CPL']
  # Monthly cohorts (plans only: facts come from Bitrix / formulas).
  mkt_new_objects:
    section: Marketing
    rows: ['Новые объекты']
  mkt_cv_lead_contract:
    section: Marketing
    rows: ['CV: лид - договор']
  mkt_cac:
    section: Marketing
    rows: ['CAC', 'CAC объекта']
  mkt_direct_site_sum:
    section: Marketing
    rows: ['Прямые бронирования с сайта: сумма', 'Прямые бронирования с сайта: сумма (по дате создания)']

  # Revenue
  rev_stayed_sum:
    section: Revenue
    rows: ['Сумма бронирований (прожили)', 'Сумма бронирований (прожили) - 5000', 'Сумма бронирований (прожили) - 2000 (после 16 ноября - 1500)']
  rev_bookings_sum:
    section: Revenue
    # September called it "План-факт продаж" (same daily sums as the later "общая").
    rows: ['Сумма бронирований (общая)', 'План-факт продаж']
  rev_arrivals_count:
    section: Revenue
    rows: ['Количество заездов (check in)', 'Кол-во заездов (check in)']
  rev_avg_booking:
    section: Revenue
    rows: ['Cредняя сумма брони (check in)']
  rev_adr:
    section: Revenue
    rows: ['ADR апартаменты (check in)']
  rev_cancelled_count:
    section: Revenue
    rows: ['Кол-во отменненых бронирований']
  # rev_occupancy is the guest occupancy. «Загрузка (%, факт)» of September/October and «Загрузка общая» of November
  # also count owner stays (Marta, 11.11.2026) and belong to rev_occupancy_total (plan only: the facts are computed).
  rev_occupancy_total:
    section: Revenue
    rows: ['Загрузка общая (%, факт)', 'Загрузка (%, факт)']
  # The forecast itself is computed (point-in-time), the sheet gives only its plan.
  rev_occupancy_next5:
    section: Revenue
    rows: ['Загрузка на следующие 5 дней']
  rev_occupancy:
    section: Revenue
    rows: ['Загрузка по гостевым бронированиям', 'Загрузка по гостевым бронированиям - 20% (после 16 ноября - 15%)']
  rev_adr_villa:
    section: Revenue
    rows: ['ADR виллы и дома (check in)']
  rev_long_count:
    section: Revenue
    rows: ['Долгосрочные брони']
  rev_long_sum:
    section: Revenue
    rows: ['Сумма долгосрочных бронирований']
  rev_cancelled_sum:
    section: Revenue
    rows: ['Сумма отмененных бронирований']

