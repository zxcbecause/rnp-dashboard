# Tech («IT» section of «Метрики РНП», sheet «Ноябрь», kept by Takhmina), 10.11.2026.
# Loaded with `php bin/console app:metric:catalog config/metrics/tech-2026-11.yaml` (idempotent: by code).
# Projects: the sheet logs the progress made each day (2 % + 2 % + 4 % ...), the week is their sum and the month plan
# is 100 % — so a project metric is a percent summed over time, not an average (an increment, not a ratio).

units:
  Tech:
    sort_from: 700
    metrics:
      - code: tech_timeline
        name: Таймлайн проектов (ЦКП — сданные в срок)
        unit: percent
        card: ['Общий прогресс по всем проектам отдела: какая часть работ сдана в срок', 'Σ прироста прогресса за дни периода, % (месячный план — 100 %)', 'Вручную (Регина)', 'Неделя, месяц = сумма недель']
