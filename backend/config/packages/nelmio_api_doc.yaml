nelmio_api_doc:
    documentation:
        info:
            title: RNP Dashboard Acme API
            description: Metrics tree, weekly RNP screen, actions, sprints and error log.
            version: 0.1.0
        components:
            securitySchemes:
                Bearer:
                    type: http
                    scheme: bearer
                    bearerFormat: JWT
                # Push API source token (app:ingest-token create), only for /api/ingest/*.
                IngestToken:
                    type: http
                    scheme: bearer
                    bearerFormat: rnp_…
        security:
            - Bearer: []
    areas:
        path_patterns:
            - ^/api(?!/doc(\.json)?$)
