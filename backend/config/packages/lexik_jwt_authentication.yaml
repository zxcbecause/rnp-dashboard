lexik_jwt_authentication:
    secret_key: '%env(resolve:JWT_SECRET_KEY)%'
    public_key: '%env(resolve:JWT_PUBLIC_KEY)%'
    pass_phrase: '%env(JWT_PASSPHRASE)%'
    # Must stay below the refresh token ttl (1800), otherwise a client has no
    # reason to refresh before the refresh token has already expired.
    token_ttl: 900
