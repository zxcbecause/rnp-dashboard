security:
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    role_hierarchy:
        # Global admin sees every org unit. Org-level roles (head/member/viewer/admin)
        # live in org_membership and are resolved by AccessScopeResolver.
        ROLE_ADMIN: [ROLE_USER]

    providers:
        # Local accounts. Switching to platform login later means adding another
        # authenticator/provider here; the rest of the app only sees App\Entity\Auth\User.
        app_user_provider:
            entity:
                class: App\Entity\Auth\User
                property: email

    firewalls:
        dev:
            pattern: ^/(_profiler(/|$)|(_wdt|assets|build)/)
            security: false
        api_login:
            pattern: ^/api/login$
            stateless: true
            provider: app_user_provider
            user_checker: App\Security\ActiveUserChecker
            json_login:
                check_path: /api/login
                success_handler: lexik_jwt_authentication.handler.authentication_success
                failure_handler: lexik_jwt_authentication.handler.authentication_failure
            login_throttling:
                max_attempts: 5
                interval: '15 minutes'
                lock_factory: 'lock.factory'
        # Push API: scripts authenticate with a source token (IngestToken), never with a JWT.
        api_ingest:
            pattern: ^/api/ingest/
            stateless: true
            custom_authenticators: [App\Security\Ingest\IngestTokenAuthenticator]
            entry_point: App\Security\Ingest\IngestTokenAuthenticator
        api:
            pattern: ^/api
            stateless: true
            entry_point: jwt
            provider: app_user_provider
            user_checker: App\Security\ActiveUserChecker
            jwt: ~
            refresh_jwt:
                check_path: /api/token/refresh
                invalidate_token_on_logout: true
            # POST {"refreshToken": "..."} deletes the refresh token server-side.
            logout:
                path: api_logout
        main:
            lazy: true
            provider: app_user_provider

    access_control:
        - { path: ^/api/doc, roles: PUBLIC_ACCESS }
        - { path: ^/api/health$, roles: PUBLIC_ACCESS }
        - { path: ^/api/(login|logout|token/refresh)$, roles: PUBLIC_ACCESS }
        - { path: ^/api/ingest/, roles: ROLE_INGEST }
        - { path: ^/api, roles: ROLE_USER }

when@test:
    security:
        password_hashers:
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10
