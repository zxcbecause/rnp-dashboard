; Production PHP settings (the code is baked into the image, so opcache never re-checks files).
opcache.enable = 1
opcache.enable_cli = 1
opcache.memory_consumption = 256
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 0
realpath_cache_size = 4096k
realpath_cache_ttl = 600
memory_limit = 256M
; AI endpoints raise it for themselves (set_time_limit); nginx waits up to 180 s.
max_execution_time = 30
upload_max_filesize = 16M
post_max_size = 16M
expose_php = Off
display_errors = Off
log_errors = On
; Same as dev (docker/php/conf.d/app.ini): raw data, sync windows and "today" are Madrid wall time.
date.timezone = Europe/Madrid
