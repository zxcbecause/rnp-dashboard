; Production scheduler (mcuadros/ofelia): jobs exec into the running containers of docker-compose.prod.yml.
; Same schedule as local docker/ofelia/config.ini, plus the nightly database backup.
; Schedules use 6 fields: seconds minutes hours day month weekday. Times are UTC.

[job-exec "platform-sync"]
schedule = 0 */30 * * * *
container = rnp-prod-php
command = php bin/console app:sync:platform --no-interaction
no-overlap = true

; Nightly full pass: housekeeping tasks and tickets have no "modified since" filter. It also recalculates the
; metrics of the last 12 months (the 30-minute runs cover two): a booking cancelled or changed long after its
; creation day still corrects that day (Gleb, 11.11.2026).
; 02:40, not on the half hour: the incremental job would hold the sync lock and the full pass would be skipped.
[job-exec "platform-sync-full"]
schedule = 0 40 2 * * *
container = rnp-prod-php
command = php bin/console app:sync:platform --full --recalc-months=12 --no-interaction
no-overlap = true

[job-exec "bitrix-sync"]
schedule = 0 15,45 * * * *
container = rnp-prod-php
command = php bin/console app:sync:bitrix --no-interaction
no-overlap = true

[job-exec "bitrix-sync-full"]
schedule = 0 0 3 * * *
container = rnp-prod-php
command = php bin/console app:sync:bitrix --full --recalc-months=12 --no-interaction
no-overlap = true

; Nightly dump of the database into the backups volume (kept 14 days), see docker/prod/backup.sh.
[job-exec "db-backup"]
schedule = 0 20 1 * * *
container = rnp-prod-mariadb
command = sh /usr/local/bin/rnp-backup.sh
no-overlap = true

; The nightly bookings snapshot (app:bookings:snapshot --scheduled, 21:55 and 22:55 UTC = 23:55 Madrid) is no longer
; scheduled: Gleb decided on 11.11.2026 that a booking counts for its creation day in its current state, so no
; metric reads the snapshot. The command and the booking_day_snapshot table stay.
