memory_limit = 512M
short_open_tag = off
date.timezone = Europe/Madrid

; vendor/ and var/cache are Docker volumes (see docker-compose.yml): only our own ~50 files per request stay
; on the slow Windows bind mount, so opcache may re-check them on every request and edits apply at once.
opcache.enable = 1
opcache.validate_timestamps = 1
opcache.revalidate_freq = 0
opcache.memory_consumption = 256
opcache.interned_strings_buffer = 32
opcache.max_accelerated_files = 30000
realpath_cache_size = 4096K
realpath_cache_ttl = 600
