# Throwaway stand for browser e2e tests (Playwright). Run with `sh e2e/run.sh` (or `make e2e`), which starts it,
# loads migrations + fixtures, runs the tests and removes everything (`down -v`).
#
# Isolation from the dev stack:
#   - own project/network (rnp-e2e), own database in memory (tmpfs) - the dev database is never touched;
#   - backend in APP_ENV=test: .env.local (real platform/Bitrix credentials) is not loaded, both API clients are
#     answered by mocks, login throttling is off; data comes from the fixtures (password rnp-local-123);
#   - frontend is the production build of the current code (what users get), plain http inside the network.
# Reuses the dev php image and the dev vendor volume (the stand needs dev dependencies: fixtures bundle).

name: rnp-e2e

services:
  mariadb:
    image: mariadb:11.4
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    environment:
      MARIADB_ROOT_PASSWORD: root
      # The test environment appends "_test" to the database name (doctrine dbname_suffix).
      MARIADB_DATABASE: rnp_e2e_test
      MARIADB_USER: rnp
      MARIADB_PASSWORD: rnp
    tmpfs:
      - /var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 3s
      timeout: 5s
      retries: 40

  php:
    image: rnp-dashboard-php
    build:
      context: ./docker/php
    environment:
      APP_ENV: test
      APP_DEBUG: "0"
      DATABASE_URL: mysql://rnp:rnp@mariadb:3306/rnp_e2e?serverVersion=11.4.0-MariaDB&charset=utf8mb4
    volumes:
      - ./backend:/var/www/backend
      - rnp-backend-vendor:/var/www/backend/vendor
      - ./docker/php/conf.d/app.ini:/usr/local/etc/php/conf.d/zz-app.ini:ro
    tmpfs:
      # Own cache, never shared with the dev container (owned by the dev user of the image).
      - /var/www/backend/var/cache:uid=1000,gid=1000,mode=0755
    depends_on:
      mariadb:
        condition: service_healthy

  nginx:
    image: nginx:1.27-alpine
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./backend/public:/var/www/backend/public:ro
    depends_on: [php]

  frontend:
    image: rnp-frontend:e2e
    build:
      context: ./frontend
      dockerfile: Dockerfile
    environment:
      NUXT_API_BASE: http://nginx/api
      # The browser reaches the stand over plain http inside the Docker network.
      NUXT_COOKIE_SECURE: "false"
      NUXT_TRUST_PROXY: "false"
    depends_on: [nginx]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/login').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 3s
      timeout: 3s
      retries: 40

  playwright:
    image: mcr.microsoft.com/playwright:v1.49.1-noble
    profiles: ["run"]
    working_dir: /e2e
    command: sh -c "npm ci --no-audit --no-fund --loglevel=error && npx playwright test"
    # Shares the frontend's network namespace: the browser opens http://localhost:3000, a secure context
    # (like production HTTPS), which Web Locks of the cross-tab session refresh require.
    network_mode: service:frontend
    environment:
      BASE_URL: http://localhost:3000
      CI: "1"
    volumes:
      - ./e2e:/e2e
      - rnp-e2e-node-modules:/e2e/node_modules
    depends_on:
      frontend:
        condition: service_healthy

volumes:
  rnp-backend-vendor:
    external: true
  rnp-e2e-node-modules:
    name: rnp-e2e-node-modules
